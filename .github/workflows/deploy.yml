name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a push always
# ends with the latest commit live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project repo is served from https://<owner>.github.io/<repo>/, so the
      # app needs that prefix. A repo literally named <owner>.github.io is served
      # from the domain root and must have no prefix. Detect rather than hardcode,
      # so renaming the repo cannot silently break every asset URL.
      - name: Work out the base path
        id: base
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          # Google Apps Script web app URL — see scripts/rsvp-sheet.gs.
          # A variable rather than a secret on purpose: it is embedded in the
          # public JavaScript either way, so marking it secret would hide it
          # from you and from nobody else. While unset, the form renders but
          # reports that replies are not open yet.
          NEXT_PUBLIC_RSVP_ENDPOINT: ${{ vars.RSVP_ENDPOINT }}

      # Pages runs Jekyll by default, which ignores directories beginning with
      # an underscore — that would drop Next's entire _next/ folder.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
